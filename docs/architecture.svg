<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 860" width="1260" height="860" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrowFed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#D97706"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1260" height="860" fill="#FCFCFB"/>

  <text x="34" y="40" font-size="21" font-weight="700" fill="#111827">Kavach v2 — architecture</text>
  <text x="34" y="61" font-size="13" fill="#6B7280">Bank-agnostic ingestion · federated threshold learning · Byzantine-robust aggregation</text>

  <rect x="24" y="86" width="876" height="690" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="44" y="111" font-size="12" font-weight="700" fill="#475569" letter-spacing="0.8">BANK-SIDE</text>
  <text x="132" y="111" font-size="12" fill="#64748B">every raw transaction begins and ends inside this boundary</text>

  <line x1="921" y1="96" x2="921" y2="766" stroke="#D97706" stroke-width="2.5" stroke-dasharray="3 6"/>
  <text x="921" y="162" font-size="11" font-weight="700" fill="#B45309" letter-spacing="1.4"
        transform="rotate(90 921 162)" dy="-9">TRUST BOUNDARY</text>

  <rect x="944" y="300" width="292" height="318" rx="14" fill="#FFFBF5" stroke="#EA9A3E" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="964" y="326" font-size="12" font-weight="700" fill="#B45309" letter-spacing="0.8">CENTRAL AGGREGATOR</text>
  <text x="964" y="344" font-size="11.5" fill="#92704B">sees weight vectors only — never a row</text>

  <text x="44" y="140" font-size="11" font-weight="700" fill="#334155" letter-spacing="0.8">PER-TRANSACTION PATH</text>
  <text x="228" y="140" font-size="11" fill="#94A3B8">runs on every incoming webhook</text>

  <rect x="44" y="152" width="170" height="74" rx="9" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="129" y="182" font-size="13.5" font-weight="600" fill="#1F2937" text-anchor="middle">Core-banking webhook</text>
  <text x="129" y="201" font-size="11" fill="#6B7280" text-anchor="middle">Finacle · T24 · BaNCS</text>
  <text x="129" y="216" font-size="11" fill="#6B7280" text-anchor="middle">three different schemas</text>

  <rect x="254" y="152" width="170" height="74" rx="9" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="339" y="178" font-size="13.5" font-weight="600" fill="#1F2937" text-anchor="middle">Adapter registry</text>
  <text x="339" y="197" font-size="11" fill="#6B7280" text-anchor="middle">auth → normalise → validate</text>
  <text x="339" y="213" font-size="11" font-weight="600" fill="#B45309" text-anchor="middle">rejects, never half-fills</text>

  <rect x="464" y="152" width="170" height="74" rx="9" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <text x="549" y="178" font-size="13.5" font-weight="600" fill="#1F2937" text-anchor="middle">Free-text sanitizer</text>
  <text x="549" y="197" font-size="11" fill="#6B7280" text-anchor="middle">§5.2 · payer-typed remarks</text>
  <text x="549" y="213" font-size="11" font-weight="600" fill="#6D28D9" text-anchor="middle">→ delimited data block</text>

  <rect x="674" y="152" width="170" height="74" rx="9" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="759" y="182" font-size="13.5" font-weight="600" fill="#1F2937" text-anchor="middle">LLM classifier</text>
  <text x="759" y="201" font-size="11" fill="#6B7280" text-anchor="middle">system prompt is</text>
  <text x="759" y="216" font-size="11" fill="#6B7280" text-anchor="middle">byte-identical every call</text>

  <line x1="214" y1="189" x2="248" y2="189" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="424" y1="189" x2="458" y2="189" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="634" y1="189" x2="668" y2="189" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="674" y="272" width="170" height="74" rx="9" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="759" y="299" font-size="13.5" font-weight="600" fill="#1F2937" text-anchor="middle">Local model</text>
  <text x="759" y="317" font-size="11" fill="#6B7280" text-anchor="middle">global baseline</text>
  <text x="759" y="332" font-size="11" fill="#6B7280" text-anchor="middle">+ local fine-tune</text>

  <rect x="404" y="398" width="230" height="80" rx="9" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
  <text x="519" y="425" font-size="13.5" font-weight="600" fill="#1F2937" text-anchor="middle">Threshold bridge</text>
  <text x="519" y="444" font-size="11" fill="#6B7280" text-anchor="middle">probability → level, per-bank cutoff</text>
  <text x="519" y="462" font-size="11" font-weight="600" fill="#0F766E" text-anchor="middle">fails to L2 · never to L0</text>

  <path d="M 700 226 C 700 268 519 280 519 392" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="556" y="266" font-size="10.5" fill="#94A3B8">verdict</text>

  <path d="M 674 316 C 620 330 634 372 634 432" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="648" y="374" font-size="10.5" fill="#94A3B8">p(fraud)</text>

  <rect x="44" y="538" width="160" height="62" rx="9" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.6"/>
  <text x="124" y="563" font-size="13" font-weight="700" fill="#15803D" text-anchor="middle">L0 · allow</text>
  <text x="124" y="581" font-size="10.5" fill="#4D7C5A" text-anchor="middle">no friction</text>

  <rect x="224" y="538" width="160" height="62" rx="9" fill="#FEFCE8" stroke="#CA8A04" stroke-width="1.6"/>
  <text x="304" y="563" font-size="13" font-weight="700" fill="#A16207" text-anchor="middle">L1 · warn</text>
  <text x="304" y="581" font-size="10.5" fill="#857040" text-anchor="middle">in-app caution</text>

  <rect x="404" y="538" width="160" height="62" rx="9" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="484" y="563" font-size="13" font-weight="700" fill="#C2410C" text-anchor="middle">L2 · hold</text>
  <text x="484" y="581" font-size="10.5" fill="#9A5B3A" text-anchor="middle">human review</text>

  <rect x="584" y="538" width="160" height="62" rx="9" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="664" y="563" font-size="13" font-weight="700" fill="#B91C1C" text-anchor="middle">L3 · hard lock</text>
  <text x="664" y="581" font-size="10.5" fill="#9B4444" text-anchor="middle">freeze + escalate</text>

  <path d="M 470 478 C 380 500 160 506 124 532" fill="none" stroke="#94A3B8" stroke-width="1.4" marker-end="url(#arrowMuted)"/>
  <path d="M 496 478 C 440 502 340 508 304 532" fill="none" stroke="#94A3B8" stroke-width="1.4" marker-end="url(#arrowMuted)"/>
  <path d="M 519 478 L 486 532" fill="none" stroke="#94A3B8" stroke-width="1.4" marker-end="url(#arrowMuted)"/>
  <path d="M 545 478 C 600 502 630 508 662 532" fill="none" stroke="#94A3B8" stroke-width="1.4" marker-end="url(#arrowMuted)"/>

  <rect x="404" y="640" width="180" height="66" rx="9" fill="#FFFFFF" stroke="#D97706" stroke-width="1.8"/>
  <text x="494" y="664" font-size="12.5" font-weight="600" fill="#1F2937" text-anchor="middle">Local trainer</text>
  <text x="494" y="681" font-size="10.5" fill="#6B7280" text-anchor="middle">/feedback: confirmed fraud</text>
  <text x="494" y="695" font-size="10.5" fill="#6B7280" text-anchor="middle">· false positive</text>

  <rect x="664" y="640" width="180" height="66" rx="9" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="754" y="664" font-size="12.5" font-weight="600" fill="#1F2937" text-anchor="middle">RBI FR-2 draft</text>
  <text x="754" y="681" font-size="10.5" font-weight="600" fill="#B91C1C" text-anchor="middle">COMPLIANCE REVIEW REQUIRED</text>
  <text x="754" y="695" font-size="10.5" font-weight="600" fill="#B91C1C" text-anchor="middle">filing_ready: false</text>

  <path d="M 478 600 L 470 634" fill="none" stroke="#D97706" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrowFed)"/>
  <path d="M 610 600 C 580 620 552 626 534 634" fill="none" stroke="#D97706" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrowFed)"/>
  <path d="M 690 600 L 726 634" fill="none" stroke="#94A3B8" stroke-width="1.4" marker-end="url(#arrowMuted)"/>

  <rect x="968" y="492" width="244" height="96" rx="9" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>
  <text x="1090" y="518" font-size="13.5" font-weight="600" fill="#1F2937" text-anchor="middle">Coordinate-median</text>
  <text x="1090" y="536" font-size="13.5" font-weight="600" fill="#1F2937" text-anchor="middle">aggregation</text>
  <text x="1090" y="557" font-size="10.5" fill="#6B7280" text-anchor="middle">1 of 4 poisoned: 0.68 → 0.68</text>
  <text x="1090" y="573" font-size="10.5" fill="#6B7280" text-anchor="middle">same attack on FedAvg: → 0.001</text>

  <rect x="968" y="368" width="244" height="74" rx="9" fill="#FFFFFF" stroke="#EA9A3E" stroke-width="1.5"/>
  <text x="1090" y="396" font-size="13.5" font-weight="600" fill="#1F2937" text-anchor="middle">Versioned model store</text>
  <text x="1090" y="415" font-size="11" fill="#6B7280" text-anchor="middle">spec-checked</text>
  <text x="1090" y="430" font-size="11" fill="#6B7280" text-anchor="middle">mismatched shape → reject</text>

  <line x1="1090" y1="492" x2="1090" y2="448" stroke="#D97706" stroke-width="1.8" marker-end="url(#arrowFed)"/>

  <path d="M 494 706 L 494 736 Q 494 746 504 746 L 874 746 Q 884 746 884 736 L 884 552 Q 884 542 894 540 L 960 540"
        fill="none" stroke="#D97706" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowFed)"/>
  <text x="560" y="739" font-size="11" font-weight="700" fill="#B45309">weight delta only — never a row</text>

  <path d="M 968 396 C 906 396 890 322 848 306" fill="none" stroke="#D97706" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowFed)"/>
  <text x="812" y="350" font-size="11" font-weight="700" fill="#B45309">global baseline</text>

  <rect x="44" y="272" width="170" height="74" rx="9" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="129" y="298" font-size="12.5" font-weight="600" fill="#64748B" text-anchor="middle">Voice liveness</text>
  <text x="129" y="316" font-size="10.5" fill="#94A3B8" text-anchor="middle">interface + stub only</text>
  <text x="129" y="332" font-size="10.5" font-weight="600" fill="#64748B" text-anchor="middle">true / false / unknown</text>
  <path d="M 214 296 C 280 292 306 258 330 234" fill="none" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrowMuted)"/>
  <text x="220" y="250" font-size="10.5" fill="#94A3B8">unknown is never coerced to false</text>

  <line x1="44" y1="816" x2="82" y2="816" stroke="#334155" stroke-width="1.8"/>
  <text x="90" y="820" font-size="11.5" fill="#475569">per-transaction path</text>

  <line x1="228" y1="816" x2="266" y2="816" stroke="#D97706" stroke-width="1.8" stroke-dasharray="5 4"/>
  <text x="274" y="820" font-size="11.5" fill="#475569">federated learning loop (periodic)</text>

  <line x1="514" y1="816" x2="552" y2="816" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="560" y="820" font-size="11.5" fill="#475569">interface only — not implemented</text>

  <text x="812" y="820" font-size="11.5" font-style="italic" fill="#94A3B8">Adapter mappings, FR-2 fields and liveness are unverified</text>

</svg>
